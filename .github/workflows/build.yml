name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Require a release key for tagged builds
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::This is a tagged release build but ANDROID_KEYSTORE_BASE64" \
               "is not set. Add the release signing secrets before tagging."
          exit 1

      - name: Configure release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "Signing configured with the supplied release keystore."

      - name: Warn when no release key is configured
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - building with an" \
               "debug key."

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Report signing certificate
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found; skipping certificate report."
            exit 0
          fi
          # This digest must stay the same between builds.
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -E 'SHA-256 digest|certificate DN' || true

      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Rename outputs
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/openshock_mobile-${{ env.VERSION }}.apk
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/openshock_mobile-${{ env.VERSION }}.aab

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: openshock_mobile-${{ env.VERSION }}-apk
          path: build/app/outputs/flutter-apk/openshock_mobile-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: openshock_mobile-${{ env.VERSION }}-aab
          path: build/app/outputs/bundle/release/openshock_mobile-${{ env.VERSION }}.aab
          if-no-files-found: error

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          # ditto preserves symlinks that `cp -r` can mangle.
          ditto Runner.app Payload/Runner.app
          find Payload -name '.DS_Store' -delete
          zip -r -y -X "openshock_mobile-${{ env.VERSION }}.ipa" Payload \
            -x '**/.DS_Store' '**/__MACOSX/*'

      - name: Verify .ipa structure
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          IPA="openshock_mobile-${{ env.VERSION }}.ipa"

          file "$IPA"
          unzip -l "$IPA" | head -20

          rm -rf _verify && mkdir _verify
          unzip -q "$IPA" 'Payload/Runner.app/Info.plist' -d _verify
          plutil -lint _verify/Payload/Runner.app/Info.plist
          echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' _verify/Payload/Runner.app/Info.plist)"
          echo "CFBundleVersion:    $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' _verify/Payload/Runner.app/Info.plist)"

          test -f Payload/Runner.app/Runner
          file Payload/Runner.app/Runner | grep -q 'Mach-O'

          if [ -d Payload/Runner.app/_CodeSignature ]; then
            echo "NOTE: bundle carries a code signature"
          else
            echo "NOTE: bundle is UNSIGNED - it must be re-signed (Sideloadly, AltStore, or a dev/enterprise cert) before iOS will install it"
          fi
          rm -rf _verify

      - name: Upload iOS build
        uses: actions/upload-artifact@v7
        with:
          name: openshock_mobile-${{ env.VERSION }}-ipa
          path: build/ios/iphoneos/openshock_mobile-${{ env.VERSION }}.ipa
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: ls -lR dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/openshock_mobile-${{ env.VERSION }}.apk
            dist/openshock_mobile-${{ env.VERSION }}.aab
            dist/openshock_mobile-${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          body: |
            Build `${{ github.sha }}`.