name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    # Secrets cannot be referenced from a step-level `if:`, so surface them as
    # job environment variables and branch on those instead. A fork PR sees
    # these as empty and falls back to an ephemeral debug key.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # A tagged build produces the artifacts published to the release page, so
      # refuse to build one with the throwaway debug key rather than shipping a
      # release nobody can upgrade and Play will not accept.
      - name: Require a release key for tagged builds
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::This is a tagged release build but ANDROID_KEYSTORE_BASE64" \
               "is not set. Add the release signing secrets before tagging."
          exit 1

      - name: Configure release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          # `base64 -d` fails loudly on a malformed secret rather than writing a
          # truncated keystore that only breaks later during the build.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          # A PKCS12 keystore - keytool's default since Java 9 - cannot hold a
          # key password that differs from the store password; keytool ignores
          # -keypass with a warning. Supplying a different one here fails the
          # build with "Given final block not properly padded", so default the
          # key password to the store password unless one is explicitly set.
          # storeFile is resolved relative to the app module directory.
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "Signing configured with the supplied release keystore."

      - name: Warn when no release key is configured
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - building with an" \
               "ephemeral debug key. The signature changes every run, so this" \
               "build will not install over a previous one and is not" \
               "distributable. Expected for fork pull requests."

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Report signing certificate
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found; skipping certificate report."
            exit 0
          fi
          # The SHA-256 digest identifies the signing key. It has to stay the
          # same between builds for an update to install over a previous one.
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -E 'SHA-256 digest|certificate DN' || true

      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Rename outputs
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/openshock_mobile-${{ env.VERSION }}.apk
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/openshock_mobile-${{ env.VERSION }}.aab

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: openshock_mobile-${{ env.VERSION }}-apk
          path: build/app/outputs/flutter-apk/openshock_mobile-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: openshock_mobile-${{ env.VERSION }}-aab
          path: build/app/outputs/bundle/release/openshock_mobile-${{ env.VERSION }}.aab
          if-no-files-found: error

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          # ditto preserves bundle structure, symlinks and extended attributes
          # exactly; a plain `cp -r` can mangle framework bundles.
          ditto Runner.app Payload/Runner.app
          # Strip Finder droppings that confuse some installers.
          find Payload -name '.DS_Store' -delete
          zip -r -y -X "openshock_mobile-${{ env.VERSION }}.ipa" Payload \
            -x '**/.DS_Store' '**/__MACOSX/*'

      - name: Verify .ipa structure
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          IPA="openshock_mobile-${{ env.VERSION }}.ipa"

          # An IPA must be a zip whose first entry path is Payload/<App>.app/
          file "$IPA"
          unzip -l "$IPA" | head -20

          # Info.plist must exist and be a parseable plist. If this file is ever
          # HTML or truncated, on-device installers fail with
          # NSCocoaErrorDomain 3840 "unknown tag html".
          rm -rf _verify && mkdir _verify
          unzip -q "$IPA" 'Payload/Runner.app/Info.plist' -d _verify
          plutil -lint _verify/Payload/Runner.app/Info.plist
          echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' _verify/Payload/Runner.app/Info.plist)"
          echo "CFBundleVersion:    $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' _verify/Payload/Runner.app/Info.plist)"

          # Executable must be present and be a real Mach-O binary.
          test -f Payload/Runner.app/Runner
          file Payload/Runner.app/Runner | grep -q 'Mach-O'

          # This build is intentionally unsigned - make that explicit in the log
          # so a failed install is not mistaken for a packaging bug.
          if [ -d Payload/Runner.app/_CodeSignature ]; then
            echo "NOTE: bundle carries a code signature"
          else
            echo "NOTE: bundle is UNSIGNED - it must be re-signed (Sideloadly, AltStore, or a dev/enterprise cert) before iOS will install it"
          fi
          rm -rf _verify

      - name: Upload iOS build
        uses: actions/upload-artifact@v7
        with:
          name: openshock_mobile-${{ env.VERSION }}-ipa
          path: build/ios/iphoneos/openshock_mobile-${{ env.VERSION }}.ipa
          if-no-files-found: error

  # Actions artifacts are re-zipped by GitHub and sit behind an authenticated
  # URL, so you cannot hand one straight to a device. Release assets are served
  # raw and unauthenticated, which makes the .ipa directly downloadable.
  #
  # Note this does NOT make the .ipa installable: the bundle produced by
  # `--no-codesign` has no _CodeSignature and no embedded.mobileprovision, so
  # iOS refuses it regardless of how it is delivered. It must be re-signed
  # first (Sideloadly / AltStore with a free Apple ID, or a real cert).
  release:
    name: Publish release assets
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: ls -lR dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/openshock_mobile-${{ env.VERSION }}.apk
            dist/openshock_mobile-${{ env.VERSION }}.aab
            dist/openshock_mobile-${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          body: |
            Builds from `${{ github.sha }}`.

            The `.apk` and `.aab` are signed with the project's release key and
            install directly. Android will refuse to install over a copy signed
            with a different key, so uninstall any earlier debug-signed build
            first.

            The `.ipa` is **unsigned** and cannot be installed on a stock iPhone
            as-is. Sign it first with Sideloadly, AltStore, or your own
            developer/enterprise certificate.
