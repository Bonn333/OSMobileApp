name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Build Android (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build unsigned APK
        run: flutter build apk --release

      - name: Build unsigned App Bundle
        run: flutter build appbundle --release

      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Rename outputs
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/openshock_mobile-${{ env.VERSION }}.apk
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/openshock_mobile-${{ env.VERSION }}.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openshock_mobile-${{ env.VERSION }}-apk
          path: build/app/outputs/flutter-apk/openshock_mobile-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: openshock_mobile-${{ env.VERSION }}-aab
          path: build/app/outputs/bundle/release/openshock_mobile-${{ env.VERSION }}.aab
          if-no-files-found: error

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Set version string
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Package unsigned .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/Runner.app
          zip -r -X "openshock_mobile-${{ env.VERSION }}.ipa" Payload

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: openshock_mobile-${{ env.VERSION }}-ipa
          path: build/ios/iphoneos/openshock_mobile-${{ env.VERSION }}.ipa
          if-no-files-found: error
