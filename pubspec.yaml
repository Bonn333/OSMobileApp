name: openshock_mobile
description: "The Official OpenShock Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Base Flutter Dependencies
  cupertino_icons: ^1.0.8

  # HTTP and Networking Dependencies
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
  http: ^1.6.0

  # Hosts the Cloudflare Turnstile widget that /2/account/login requires
  webview_flutter: ^4.10.0

  # Preference and Storage Dependencies
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # State Management
  provider: ^6.1.5

  # UI Utilities
  flutter_svg: ^2.2.3
  signalr_core: ^1.1.2
  flat_buffers: ^25.9.23
  web_socket_channel: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Base Flutter Dev Dependencies
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/os/
